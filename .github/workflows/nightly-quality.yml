name: Nightly Quality

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  nightly:
    name: Nightly Soak/Chaos/Perf
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HUSKER_RUN_IGNORED_E2E: ${{ vars.HUSKER_RUN_IGNORED_E2E_NIGHTLY }}
      HUSKER_RUN_NET_E2E: ${{ vars.HUSKER_RUN_NET_E2E_NIGHTLY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest
      - run: cargo install cargo-mutants --locked
      - run: make nightly-quality
