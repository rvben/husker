name: Idle Policy E2E

# Real-Firecracker gate for the idle policy: boot a VM, let it go idle and
# suspend (full-state snapshot, memory freed), then resume it on the next
# connect - the suspend -> reap-timer -> resume-on-connect round trip that
# mock-based unit tests cannot reach (crates/husker-core/tests/idle_policy_e2e.rs,
# #[ignore], linux-net-only).
#
# Needs nested KVM + Firecracker + TAP privileges, so it runs on the self-hosted
# runner labelled (self-hosted, husker, linux) with passwordless sudo, a root
# Rust toolchain, Firecracker, and nftables - the same host as the other e2e
# gates. Runs nightly and on manual dispatch.
on:
  workflow_dispatch:
  schedule:
    # Nightly; staggered after the suspend-fork gate (one runner, runs serially).
    - cron: "30 5 * * *"

jobs:
  idle-policy-e2e:
    name: Idle Policy E2E (self-hosted, KVM)
    runs-on: [self-hosted, husker, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Resolve kernel + rootfs from the latest images-* release (the standard
      # Firecracker/MMIO kernel boots here, unlike the QEMU gate). Written to a
      # temp dir the daemon can read; the rootfs is cloned CoW per VM.
      #
      # The images live under RUNNER_TEMP, which the runner clears between jobs,
      # and the job removes them itself in its final step. A bare `mktemp -d`
      # has neither bound: this step and its twin in e2e-gated.yml wrote a
      # ~299 MB kernel+rootfs+initramfs trio into /tmp on every nightly run and
      # never removed it, which is what filled the self-hosted runner's root
      # disk. Keep both bounds - they fail independently.
      - name: Fetch guest images
        id: images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/guest-images"
          rm -rf "$work"
          mkdir -p "$work"
          url="$(bash scripts/ci/resolve-images-tag.sh --url)"
          echo "using images from ${url##*/}"
          curl -fsSL "${url}/kernel-x86_64"     -o "${work}/kernel"
          curl -fsSL "${url}/rootfs-x86_64.ext4" -o "${work}/rootfs.ext4"
          curl -fsSL "${url}/initramfs-x86_64.gz" -o "${work}/initramfs.gz"
          {
            echo "kernel=${work}/kernel"
            echo "rootfs=${work}/rootfs.ext4"
            echo "initrd=${work}/initramfs.gz"
          } >> "$GITHUB_OUTPUT"

      # The gated target uses cargo-nextest; ensure it exists for root.
      - name: Ensure cargo-nextest (root)
        run: |
          sudo bash -c 'command -v /root/.cargo/bin/cargo-nextest >/dev/null \
            || curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /root/.cargo/bin'

      # Runs entirely as root (HOME=/root) on the runner's root toolchain, with an
      # out-of-tree CARGO_TARGET_DIR so the ubuntu-owned checkout stays clean.
      - name: Idle-policy e2e gate
        run: |
          sudo env \
            HOME=/root \
            PATH="/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            CARGO_TARGET_DIR=/var/tmp/husker-e2e-target \
            HUSKER_RUN_IDLE_POLICY_E2E=1 \
            HUSKER_E2E_KERNEL="${{ steps.images.outputs.kernel }}" \
            HUSKER_E2E_ROOTFS="${{ steps.images.outputs.rootfs }}" \
            HUSKER_E2E_INITRD="${{ steps.images.outputs.initrd }}" \
            make test-idle-policy-e2e-gated

      # Second bound on the guest images, independent of the runner clearing
      # RUNNER_TEMP between jobs. `always()` so a failed or cancelled gate
      # still gives the disk back.
      - name: Remove guest images
        if: always()
        run: rm -rf "${RUNNER_TEMP}/guest-images"
