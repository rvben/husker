name: Build default images

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not create the release)'
        required: false
        default: true
        type: boolean
  workflow_run:
    # Republish on every husker release. The rootfs bakes in the guest agent, so
    # a monthly-only cadence let a released daemon pair with an agent up to a
    # month older than itself: protocol 3 landed 2026-08-05 while the newest
    # published image was images-2026-08-01, so every `husker image pull` in
    # between silently got a protocol 2 agent and lost the features gated on it.
    #
    # This keys off the Release workflow finishing rather than `release:
    # published`, because that event never arrives: the release is created by
    # softprops/action-gh-release authenticated with GITHUB_TOKEN, and GitHub
    # does not start workflow runs from events a GITHUB_TOKEN created. A
    # `release:` trigger here is silently inert, which is how it went unnoticed.
    workflows: [Release]
    types: [completed]
  schedule:
    # Rebuild monthly so Alpine + kernel fixes land in the default image even
    # when there has been no husker release.
    - cron: '0 7 1 * *'

permissions:
  contents: write

# Serialise: a release-triggered run and the monthly cron can otherwise overlap
# and race to publish, and both write to the same tag namespace.
concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    # A failed or cancelled Release must not publish images. The other triggers
    # carry no workflow_run context, so they are unaffected.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            musl-target: x86_64-unknown-linux-musl
            agent-make: build-agent
            runner: ubuntu-latest
          - arch: aarch64
            musl-target: aarch64-unknown-linux-musl
            agent-make: build-agent-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # On workflow_run the default ref is the default branch, which can already
      # have moved past the release. Build from the commit the Release ran on so
      # the baked agent is exactly the one that daemon release ships. Empty on
      # every other trigger, where the default ref is already correct.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # e2fsprogs: debugfs for rootfs baking
          # musl-tools: x86_64-linux-musl-gcc for x86_64 agent cross
          # build-essential bc bison flex libelf-dev libssl-dev: kernel build
          sudo apt-get install -y e2fsprogs musl-tools \
            build-essential bc bison flex libelf-dev libssl-dev
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            # Set the musl linker to the apt gcc cross/native wrapper.
            # musl-tools alone does not ship aarch64-linux-musl-gcc (the
            # Makefile default), but gcc-aarch64-linux-gnu provides the
            # linker on both x86_64 runners (cross) and ARM runners (native).
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "AARCH64_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl-target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build agent
        run: make ${{ matrix.agent-make }}

      - name: Build modules-free microVM kernel from source
        run: make build-microvm-kernel ARCH=${{ matrix.arch }}

      - name: Build initramfs
        run: make build-initramfs ARCH=${{ matrix.arch }}

      - name: Build rootfs
        run: make build-rootfs ARCH=${{ matrix.arch }}

      - name: Stage artefacts
        run: |
          mkdir -p stage
          KERNEL_SRC=$( [ "${{ matrix.arch }}" = "aarch64" ] && echo Image-virt || echo vmlinux )
          cp "$HOME/.local/share/husker/kernels/$KERNEL_SRC" "stage/kernel-${{ matrix.arch }}"
          # The x86_64 kernel must carry the PVH entry note or QEMU cannot
          # direct-boot it, and host bind-mounts (--mount) auto-select QEMU. Match
          # XEN_ELFNOTE_PHYS32_ENTRY (note type 0x12) SPECIFICALLY: QEMU's PVH
          # loader keys off that note, and other Xen notes do not make the kernel
          # QEMU-bootable, so a broad "any Xen note" check could pass a kernel that
          # dropped CONFIG_PVH. readelf shows it as the decoded name or as
          # "Unknown note type: (0x00000012)". Fail the publish loudly if it is gone.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            readelf -n "stage/kernel-${{ matrix.arch }}" \
              | grep -qiE 'PHYS32_ENTRY|note type: \(0x0*12\)' \
              || { echo "FATAL: kernel-${{ matrix.arch }} lacks the PVH PHYS32_ENTRY note (CONFIG_PVH lost)" >&2; exit 1; }
          fi
          INITRAMFS_SRC=$( [ "${{ matrix.arch }}" = "aarch64" ] && echo initramfs-virt.gz || echo initramfs-x86_64-virt.gz )
          cp "$HOME/.local/share/husker/kernels/$INITRAMFS_SRC" "stage/initramfs-${{ matrix.arch }}.gz"
          cp "$HOME/.local/share/husker/images/alpine-${{ matrix.arch }}.ext4" \
             "stage/rootfs-${{ matrix.arch }}.ext4"
          # Publish the agent that went into the rootfs. `husker doctor` reports
          # the daemon's embedded agent as "sha256 <first 8 hex>, protocol N", so
          # shipping the same binary makes image-vs-daemon drift checkable by
          # comparing that line against this asset instead of guessing from dates.
          cp "target/${{ matrix.musl-target }}/agent/husker-agent" \
             "stage/husker-agent-${{ matrix.arch }}"
          ( cd stage && sha256sum kernel-* initramfs-* rootfs-* husker-agent-* > "SHA256SUMS-${{ matrix.arch }}" )

      - uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.arch }}
          path: stage/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # On workflow_run the default ref is the default branch, which can already
      # have moved past the release. Build from the commit the Release ran on so
      # the baked agent is exactly the one that daemon release ships. Empty on
      # every other trigger, where the default ref is already correct.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Merge manifests
        run: |
          mkdir -p release
          cp artifacts/images-*/kernel-* release/
          cp artifacts/images-*/initramfs-* release/
          cp artifacts/images-*/rootfs-* release/
          cp artifacts/images-*/husker-agent-* release/
          count=$(find artifacts/images-* -name 'SHA256SUMS-*' -maxdepth 1 | wc -l)
          [ "$count" -eq 2 ] || { echo "Expected 2 SHA256SUMS files, got $count" >&2; exit 1; }
          cat artifacts/images-*/SHA256SUMS-* > release/SHA256SUMS
          ls -lh release/

      # `husker image pull` picks the images release by LEXICOGRAPHIC max over
      # `images-*` tags, so the tag must sort chronologically. A UTC timestamp
      # does, and unlike a bare date it cannot collide when a release-triggered
      # run and the monthly cron land on the same day. It also sorts after the
      # older date-only tags, which are a prefix of it.
      - name: Compute tag
        id: tag
        run: echo "tag=images-$(date -u +%Y-%m-%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      # Name the agent this rootfs carries, so an image can be matched to a
      # daemon without downloading and mounting it.
      - name: Describe the baked agent
        id: agent
        run: |
          proto=$(grep -oE 'PROTOCOL_VERSION: u32 = [0-9]+' \
            crates/husker-agent-proto/src/lib.rs | grep -oE '[0-9]+$')
          [ -n "$proto" ] || { echo "could not read PROTOCOL_VERSION" >&2; exit 1; }
          echo "protocol=$proto" >> "$GITHUB_OUTPUT"
          {
            echo "sha256<<EOF"
            grep 'husker-agent-' release/SHA256SUMS
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # On schedule and on release: inputs.dry_run is null, so this evaluates to
      # true and we publish. On workflow_dispatch: honours the dry_run input
      # (default true).
      - name: Create release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Default images ${{ steps.tag.outputs.tag }}
          body: |
            Default kernel, initramfs, and rootfs images for husker. The kernel is a
            modules-free build from kernel.org source with virtio and nested-container
            support built in (Docker/containerd/runc, cgroup BPF, bridge/veth,
            nftables, OverlayFS, and seccomp); the rootfs is Alpine 3.21 minirootfs.
            Verify downloads against SHA256SUMS.

            Built from `${{ github.event.workflow_run.head_sha || github.sha }}`,
            triggered by `${{ github.event_name }}`.

            The rootfs bakes in guest agent protocol **${{ steps.agent.outputs.protocol }}**.
            A daemon reports its own embedded agent via `husker doctor`; when the
            protocol shown there is higher than this one, the features gated on it
            are unavailable in VMs booted from this rootfs.

            ```
            ${{ steps.agent.outputs.sha256 }}
            ```

            File naming:
              kernel-<arch>            (uncompressed Linux Image / vmlinux, no modules)
              initramfs-<arch>.gz      (gzipped cpio, only needed by legacy modular kernels)
              rootfs-<arch>.ext4       (Alpine + husker-agent baked in)
              husker-agent-<arch>      (the exact agent baked into that rootfs)
          files: release/*

      # Only runs on workflow_dispatch with dry_run=true (default).
      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN: would publish tag ${{ steps.tag.outputs.tag }} with:"
          ls -lh release/
          cat release/SHA256SUMS
