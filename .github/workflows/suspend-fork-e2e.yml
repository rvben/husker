name: Suspend/Fork E2E

# Release gate for suspend + fork on a real Firecracker VM: create a VM, suspend
# it, then fork the suspended VM into a new running VM with a FRESH network
# identity (distinct guest IP + vsock CID), its agent reachable, while the source
# stays suspended. Exercises FC snapshot -> CoW reflink clone -> `/snapshot/load`
# with `network_overrides` -> live netlink reconfigure - the path mock-based unit
# tests cannot reach.
#
# This requires nested KVM + Firecracker + TAP privileges, which GitHub-hosted
# runners do not provide, so it runs on the self-hosted runner labelled
# (self-hosted, husker, linux) with passwordless sudo, a root Rust toolchain,
# Firecracker, and nftables. Runs nightly and on manual dispatch.
#
# The gate runs an isolated daemon (own bridge/subnet/CID range, temp data dir +
# port), so it is safe alongside any production daemon on the same host.
on:
  workflow_dispatch:
  schedule:
    # Nightly; staggered an hour after oci-boot-e2e (one runner, runs serially).
    - cron: "30 4 * * *"

jobs:
  suspend-fork-e2e:
    name: Suspend/Fork E2E (self-hosted, KVM)
    runs-on: [self-hosted, husker, linux]
    steps:
      - uses: actions/checkout@v6
      # The gate runs entirely as root (HOME=/root) on the runner's root
      # toolchain, with an out-of-tree CARGO_TARGET_DIR so the ubuntu-owned
      # checkout stays free of root-owned build artifacts (next run's `git clean`
      # stays clean). PATH carries cargo plus the admin tools (nft/ip/firecracker)
      # the daemon shells out to.
      - name: Suspend/fork e2e gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo env \
            HOME=/root \
            PATH="/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            CARGO_TARGET_DIR=/var/tmp/husker-e2e-target \
            GITHUB_TOKEN="$GITHUB_TOKEN" \
            HUSKER_RUN_SUSPEND_FORK_E2E=1 \
            make test-suspend-fork-e2e-gated
