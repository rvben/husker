name: VZ Cloud-Image E2E

# Apple VZ cloud-image e2e on the self-hosted mac-mini (Apple Silicon):
# convert + boot a stock Ubuntu arm64 cloud image under Virtualization.framework,
# confirm the guest agent reports its DHCP IP, and reach the guest through a port
# forward (crates/husker/tests/vz_cloud_e2e.rs). The test ad-hoc-codesigns the
# daemon binary it spawns (VZ entitlement), so the gate only needs the aarch64
# agent embedded, qemu-img (qcow2->raw), and nextest.
#
# Runs nightly and on manual dispatch. The stock Ubuntu cloud image is cached
# under the runner's home and downloaded on first use, so the nightly does not
# depend on a manually-staged file surviving in /tmp.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Optional mac-mini path to an Ubuntu arm64 cloud image (blank = download stock noble)"
        required: false
        default: ""
  schedule:
    # Nightly, on the mac-mini (a different runner from the Linux e2e gates, so
    # no serialization concern with them).
    - cron: "0 7 * * *"

jobs:
  vz-cloud-e2e:
    name: VZ Cloud-Image E2E (mac-mini)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The self-hosted runner user has no uv on PATH; install it (same as release.yml).
      - uses: astral-sh/setup-uv@v10.0.1

      # zig + cargo-zigbuild (via a uv venv, mirroring release.yml) to
      # cross-build the aarch64-musl guest agent the cloud-image path embeds.
      - name: Set up zig toolchain + aarch64 agent
        run: |
          uv venv "${RUNNER_TEMP}/build-venv"
          uv pip install --python "${RUNNER_TEMP}/build-venv/bin/python" ziglang cargo-zigbuild
          # $GITHUB_PATH only affects later steps; cargo-zigbuild must be on PATH
          # for the make invocation in this same step.
          export PATH="${RUNNER_TEMP}/build-venv/bin:$PATH"
          rustup target add aarch64-unknown-linux-musl
          make build-agent-aarch64
          echo "HUSKER_EMBED_AGENT_BIN=$PWD/target/aarch64-unknown-linux-musl/agent/husker-agent" >> "$GITHUB_ENV"

      - name: Ensure cargo-nextest
        run: |
          command -v cargo-nextest >/dev/null \
            || curl -LsSf https://get.nexte.st/latest/mac | tar zxf - -C "$HOME/.cargo/bin"

      # Resolve the cloud image: use a dispatch-provided path if it exists,
      # otherwise a cached stock Ubuntu noble arm64 cloud image (downloaded once).
      # husker converts a per-VM raw copy and never mutates the source, so the
      # cached qcow2 stays reusable across nightly runs.
      - name: Ensure cloud image
        id: image
        env:
          REQUESTED: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ] && [ -f "${REQUESTED}" ]; then
            echo "using dispatch-provided image ${REQUESTED}"
            echo "path=${REQUESTED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cache="${HOME}/.cache/husker-e2e"
          img="${cache}/noble-arm64.img"
          mkdir -p "${cache}"
          if [ ! -f "${img}" ]; then
            echo "downloading stock Ubuntu noble arm64 cloud image"
            curl -fsSL \
              'https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img' \
              -o "${img}.tmp"
            mv "${img}.tmp" "${img}"
          fi
          echo "using cached image ${img}"
          echo "path=${img}" >> "$GITHUB_OUTPUT"

      - name: VZ cloud-image e2e gate
        env:
          HUSKER_RUN_VZ_CLOUD_E2E: "1"
          HUSKER_VZ_CLOUD_IMAGE: ${{ steps.image.outputs.path }}
        run: |
          # qemu-img (qcow2 -> raw) comes from Homebrew.
          export PATH="/opt/homebrew/bin:$PATH"
          make test-vz-cloud-e2e-gated
