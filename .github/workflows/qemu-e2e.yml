name: QEMU E2E

# Real QEMU/KVM boot + vsock e2e on the self-hosted Linux runner
# (crates/husker-vmm/tests/qemu_e2e.rs::qemu_boots_and_vsock, #[ignore]).
#
# The runner's staged kernel (/var/lib/husker/kernels/vmlinux) is the
# microvm-kernel with CONFIG_VIRTIO_PCI, so it boots under QEMU's q35 machine.
# Verified booting on husker-dev-fc. Runs nightly and on manual dispatch.
on:
  workflow_dispatch:
  schedule:
    # Nightly; staggered after the idle-policy gate (one runner, runs serially).
    - cron: "30 6 * * *"

jobs:
  qemu-e2e:
    name: QEMU E2E (self-hosted, KVM)
    runs-on: [self-hosted, husker, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The gated targets use cargo-nextest; ensure it exists for root (which
      # runs the e2e via sudo). Idempotent, survives a runner wipe.
      - name: Ensure cargo-nextest (root)
        run: |
          sudo bash -c 'command -v /root/.cargo/bin/cargo-nextest >/dev/null \
            || curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C /root/.cargo/bin'

      - name: QEMU e2e gate
        run: |
          # The test writes to the rootfs (cache=writeback); use a disposable copy.
          # The trap, not a trailing `rm`, is what frees it: `run:` blocks execute
          # under `bash -e`, so a failing gate aborts the step and never reaches
          # its last line - which would strand 256 MiB in /var/tmp on every red
          # build, the same way the guest-image downloads filled /tmp.
          rootfs="$(mktemp --tmpdir=/var/tmp qemu-e2e-rootfs.XXXXXX.ext4)"
          trap 'rm -f "$rootfs"' EXIT
          sudo cp /var/lib/husker/images/alpine-x86_64.ext4 "$rootfs"
          sudo env \
            HOME=/root \
            PATH="/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            CARGO_TARGET_DIR=/var/tmp/husker-e2e-target \
            HUSKER_RUN_QEMU_E2E=1 \
            HUSKER_E2E_KERNEL=/var/lib/husker/kernels/vmlinux \
            HUSKER_E2E_ROOTFS="$rootfs" \
            HUSKER_E2E_INITRD=/var/lib/husker/kernels/initramfs-x86_64-virt.gz \
            make test-qemu-e2e-gated
