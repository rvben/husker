[package]
name = "husker"
version = "0.0.2"
edition = "2024"
rust-version = "1.90"
description = "Name placeholder. husker ships via pip/Homebrew/GitHub Releases, not crates.io. See https://github.com/rvben/husker"
license = "MIT"
repository = "https://github.com/rvben/husker"
homepage = "https://github.com/rvben/husker"
readme = "README.md"
authors = ["Ruben Jongejan <ruben.jongejan@gmail.com>"]
keywords = ["microvm", "firecracker", "virtualization"]
categories = ["command-line-utilities", "virtualization"]

[[bin]]
name = "husker"
path = "src/main.rs"

# Declared as its own workspace root so the outer husker workspace does not
# try to include this placeholder in `cargo build --workspace` and so
# `cargo publish` produces a self-contained crate archive.
[workspace]
