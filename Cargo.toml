[workspace]
members = [
    "crates/husker",
    "crates/husker-core",
    "crates/husker-vmm",
    "crates/husker-net",
    "crates/husker-storage",
    "crates/husker-agent",
    "crates/husker-agent-proto",
    "crates/husker-api",
    "crates/husker-state",
    "crates/husker-cloudinit",
    "crates/husker-oci",
]
resolver = "3"

[workspace.package]
version = "0.4.40"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/rvben/husker"
license = "MIT"
authors = ["Ruben Jongejan <ruben.jongejan@gmail.com>"]
description = "An open-source microVM manager built on Firecracker"
keywords = ["microvm", "firecracker", "virtualization"]
categories = ["virtualization"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Web framework
axum = { version = "0.8", features = ["json", "ws"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Compression / archive
flate2 = "1"
tar = "0.4"

# FAT filesystem
fatfs = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }

# Terminal
crossterm = "0.29"

# WebSocket
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Hyper for Unix socket HTTP
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Internal crates
husker-core = { path = "crates/husker-core", default-features = false }
husker-vmm = { path = "crates/husker-vmm" }
husker-net = { path = "crates/husker-net" }
husker-storage = { path = "crates/husker-storage" }
husker-agent-proto = { path = "crates/husker-agent-proto" }
husker-api = { path = "crates/husker-api", default-features = false }
husker-state = { path = "crates/husker-state" }
husker-cloudinit = { path = "crates/husker-cloudinit" }
husker-oci = { path = "crates/husker-oci" }

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.dev]
# Fast compile times for development
opt-level = 0

[profile.agent]
inherits = "release"
# Guest agent: optimize for size
opt-level = "s"
lto = true
strip = true
codegen-units = 1
