[package]
name = "husker-agent"
description = "Guest agent binary for husker microVMs"
default-run = "husker-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "husker_agent"
path = "src/lib.rs"

[[bin]]
name = "husker-agent"
path = "src/main.rs"

[[bin]]
name = "husker-job-runner"
path = "src/job_runner_main.rs"

[dependencies]
sha2 = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
husker-agent-proto = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
libc = "0.2"
if-addrs = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"
