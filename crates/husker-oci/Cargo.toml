[package]
name = "husker-oci"
description = "Pull OCI/Docker images and flatten them into bootable husker rootfs images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# Pure-Rust zstd decode for OCI layers (no C dependency).
ruzstd = "0.7"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Encode zstd fixtures in tests; runtime decode uses pure-Rust ruzstd.
zstd = "0.13"
# In-process mock OCI registry for the end-to-end import test.
axum = { workspace = true }
