# Husker configuration file
#
# Config file discovery order:
#   1. --config flag (explicit path)
#   2. ~/.config/husker/config.toml (user config)
#   3. /etc/husker/config.toml (system config)
#
# All fields are optional and have sensible defaults.

# ── Storage ──────────────────────────────────────────────────────────

# Base directory for VM images, state database, and runtime files.
#   macOS default: ~/.local/share/husker
#   Linux default: /var/lib/husker when writable, otherwise ~/.local/share/husker
#                  (honors $XDG_DATA_HOME). Setting HUSKER_DATA_DIR also
#                  cascades to default_kernel/default_rootfs/default_initrd
#                  unless those are set explicitly.
# data_dir = "/var/lib/husker"

# Directory for the SQLite state database and daemon lock. Defaults to data_dir.
# Split it out to keep mutable state on a separate volume from the (larger) image
# store. Env: HUSKER_STATE_DIR.
# state_dir = "/var/lib/husker-state"

# When true, `husker setup storage` provisions the data dir on a dedicated
# loopback/volume image instead of the host filesystem. Env: HUSKER_STORAGE_VOLUME.
# storage_volume = false

# ── Default VM size ──────────────────────────────────────────────────

# Default vCPU count and memory (MiB) applied when `husker run` omits
# --cpus / --memory. Env: HUSKER_DEFAULT_CPUS, HUSKER_DEFAULT_MEMORY.
# default_cpus = 1
# default_memory = 128

# ── Kernel ───────────────────────────────────────────────────────────

# Default kernel used when --kernel is not passed to `husker run`.
#   macOS default: <data_dir>/kernels/Image-virt   (uncompressed ARM64 Image)
#   Linux default: <data_dir>/kernels/vmlinux       (uncompressed x86_64 ELF)
# default_kernel = "/var/lib/husker/kernels/vmlinux"

# Path to the default rootfs image. Used when `husker run` is invoked
# without an explicit rootfs argument.
#   aarch64 default: <data_dir>/images/alpine-aarch64.ext4
#   x86_64 default:  <data_dir>/images/alpine-x86_64.ext4
# default_rootfs = "/var/lib/husker/images/alpine-x86_64.ext4"

# Initrd/initramfs path loaded alongside the kernel at boot. Not required for
# the default husker kernel (all drivers built in); only needed for legacy
# modular kernels such as Alpine linux-virt, where virtio_blk is a loadable
# module. Build with `make build-initramfs` if you use a modular kernel.
# default_initrd = "/var/lib/husker/kernels/initramfs-virt.gz"

# Default disk size for cloud-image VMs when --disk-size is omitted (e.g. "10G").
# default_disk_size = "10G"

# OVMF firmware for UEFI/cloud-image boot (Linux only).
# ovmf_code = "/usr/share/OVMF/OVMF_CODE_4M.fd"
# ovmf_vars = "/usr/share/OVMF/OVMF_VARS_4M.fd"

# Base URL for `husker images pull`. Must host kernel-<arch>,
# initramfs-<arch>.gz, rootfs-<arch>.ext4, and SHA256SUMS at the root.
# images_base_url = "https://github.com/rvben/husker/releases/latest/download"

# ── API Security and Limits ─────────────────────────────────────────

# Optional bearer token required by mutating and shell endpoints.
# Set this in production or whenever daemon binds beyond localhost.
# api_token = "replace-with-a-long-random-token"

# Optional separate bind for a /v1/metrics endpoint, so Prometheus can scrape while
# the main API (listen) stays on localhost. Only metrics are served here (no
# exec/shell/VM control). Restrict network exposure at the host firewall. Env:
# HUSKER_METRICS_LISTEN.
# metrics_listen = "0.0.0.0:9758"

# Optional bearer token for the metrics endpoint (env: HUSKER_METRICS_TOKEN). When
# set, scrapers must send `Authorization: Bearer <token>` - defense in depth on top
# of the firewall. Independent of api_token. Unset = unauthenticated (the standard
# exporter pattern).
# metrics_token = "replace-with-a-long-random-token"

# Global max HTTP request body size accepted by the API (bytes).
# api_max_request_bytes = 2097152

# Max bytes returned by files/read endpoint before request is rejected.
# api_max_file_read_bytes = 1048576

# Max decoded bytes accepted by files/write endpoint.
# api_max_file_write_bytes = 1048576

# Sliding-window limit for sensitive API routes per client per minute.
# A value of 0 disables rate limiting.
# api_sensitive_rate_limit_per_minute = 120

# Allowed guest path prefixes for read and write operations.
# Empty lists allow all absolute guest paths.
# allowed_read_paths = ["/tmp", "/var/log"]
# allowed_write_paths = ["/tmp", "/var/tmp"]
# Host directories that may be bind-mounted into guests via --mount.
# Empty list denies all bind mounts (secure default).
# allowed_mount_host_paths = ["/srv/husker-work", "/data/shared"]

# Exec policy controls.
# Empty allowlist permits all commands not explicitly denied.
# exec_timeout_secs = 30
# Upper bound for per-request exec timeouts (husker exec/job --timeout).
# exec_timeout_max_secs = 3600
# exec_allowlist = ["echo", "ls", "cat"]
# exec_denylist = ["rm", "mkfs", "dd"]
# exec_env_allowlist = ["PATH", "HOME", "TERM"]

# ── Firecracker / QEMU (Linux only) ─────────────────────────────────

# Path to the Firecracker binary. Must be on a filesystem that supports
# execution. On most distros the default of "firecracker" works if it's
# installed in $PATH.
# firecracker_bin = "firecracker"

# VMM backend: "firecracker" (default) or "qemu" (Linux only, full QEMU/KVM VMs).
# vmm = "firecracker"
# Path to the qemu-system binary when vmm = "qemu" (env: HUSKER_QEMU_BIN).
# qemu_bin = "qemu-system-x86_64"

# ── Networking (Linux only) ──────────────────────────────────────────

# Host interface used for outbound NAT from guest VMs.
# host_interface = "eth0"

# Bridge device created by the daemon for guest networking.
# bridge_name = "husker0"

# Subnet from which /30 blocks are allocated to each VM.
# The gateway (.1 of the subnet) is assigned to the bridge.
# bridge_subnet = "172.20.0.0/24"

# DNS servers injected into guest /etc/resolv.conf via the agent.
# dns_servers = ["8.8.8.8", "1.1.1.1"]

# Starting CID for vsock and TAP-name allocation. Two co-located daemons must
# use distinct bases so their CID/TAP spaces are disjoint (e.g. 3 + 1000).
# cid_base = 1000

# Host bridge to use for bridged-mode VMs (--net bridged). The bridge must be
# pre-created by the administrator; husker only enslaves the VM's TAP to it.
# Bridged mode also requires --cloud-image (DHCP via cloud-init). Unset means
# bridged mode is unavailable and any --net bridged request is rejected.
# lan_bridge = "br0"

# ── Memory Balloon ───────────────────────────────────────────────────
#
# Memory balloon (--balloon): on macOS (Apple VZ), ballooning is partial by
# platform design. Explicit targets via `husker balloon <vm> <mib>` reclaim
# memory, but memory freed inside the guest is NOT automatically relinquished
# to the host. Restart memory-heavy VMs to fully reclaim.
# MicroVM guests need virtio_balloon in the guest initramfs; run
# 'husker images pull' to refresh the default images if ballooning fails.

# ── Resource limits (Linux, opt-in) ─────────────────────────────────
# Place each VM's VMM process in a per-VM cgroup v2 with a hard memory cap so a
# runaway VM's OOM is contained to that VM instead of the host's global OOM
# killer. Requires cgroup v2, systemd Delegate=yes on husker.service, and
# kernel >= 4.19. Off by default. Env: HUSKER_RESOURCE_LIMITS.
# resource_limits = true
# Host-memory margin (MiB) over guest RAM for memory.max. 256 is safe for
# Firecracker; QEMU with large VMs may need 512-1024.
# Note: virtiofsd helper processes for host_shares/--volume run OUTSIDE the
# VM's cgroup, so workloads using host shares should raise memory_overhead_mib
# to leave headroom (their memory is not counted against the VM's memory.max).
# memory_overhead_mib = 256
# Also cap host CPU to <vcpus> cores per VM (cpu.max). Off by default.
# cpu_limit = false

# ── Service Reconciler ───────────────────────────────────────────────

# Background reconciler for service workloads.
# service_reconcile_interval_secs = 15   # how often the self-healing loop runs
# service_reconcile_enabled = true       # master switch for the periodic reconcile loop

# ── Idle Policy ──────────────────────────────────────────────────────

# Idle policy defaults (opt-in per VM via --idle-timeout / profile).
# The loop runs on all daemons but only acts on VMs that opted in.
# [idle_policy]
# poll_interval_secs = 30            # how often the idle loop evaluates VMs
# default_idle_timeout_secs = 1800   # idle window before suspend, for VMs that opt in without a value
# default_suspend_ttl_secs = 0       # 0 = never reap a suspended VM
# default_auto_resume = true         # wake on control-plane call or inbound connection

# ── Profiles ─────────────────────────────────────────────────────────
#
# Named presets selected with `husker run --profile <name>` (and job/service).
# Every field is optional; a field left out falls back to the CLI flag or the
# daemon default. Unknown keys are rejected, so a typo fails loudly.
#
# [profiles.web]
# cpus = 2
# memory = 512
# rootfs = "/var/lib/husker/images/alpine-x86_64.ext4"
# env = ["RUST_LOG=info"]
# idle_timeout_secs = 900
#
# [profiles.ubuntu]
# cloud_image = "ubuntu-24.04-server-cloudimg-arm64.img"
# disk_size = "10G"
# ssh_keys = ["~/.ssh/id_ed25519.pub"]

# ── Environment Variable Overrides ─────────────────────────────────
#
# All configuration values can be overridden via environment variables.
# Environment variables take precedence over file-based config.
#
#   HUSKER_DATA_DIR                          →  data_dir
#   HUSKER_STATE_DIR                         →  state_dir
#   HUSKER_STORAGE_VOLUME                    →  storage_volume (1/true/yes/on)
#   HUSKER_DEFAULT_KERNEL                    →  default_kernel
#   HUSKER_DEFAULT_ROOTFS                    →  default_rootfs
#   HUSKER_DEFAULT_INITRD                    →  default_initrd
#   HUSKER_DEFAULT_DISK_SIZE                 →  default_disk_size
#   HUSKER_DEFAULT_CPUS                      →  default_cpus
#   HUSKER_DEFAULT_MEMORY                    →  default_memory
#   HUSKER_IMAGES_BASE_URL                   →  images_base_url
#   HUSKER_API_TOKEN                         →  api_token
#   HUSKER_METRICS_LISTEN                    →  metrics_listen
#   HUSKER_METRICS_TOKEN                     →  metrics_token
#   HUSKER_API_MAX_REQUEST_BYTES             →  api_max_request_bytes
#   HUSKER_API_MAX_FILE_READ_BYTES           →  api_max_file_read_bytes
#   HUSKER_API_MAX_FILE_WRITE_BYTES          →  api_max_file_write_bytes
#   HUSKER_API_SENSITIVE_RATE_LIMIT_PER_MINUTE →  api_sensitive_rate_limit_per_minute
#   HUSKER_ALLOWED_READ_PATHS                →  allowed_read_paths  (comma-separated)
#   HUSKER_ALLOWED_WRITE_PATHS               →  allowed_write_paths (comma-separated)
#   HUSKER_ALLOWED_MOUNT_HOST_PATHS          →  allowed_mount_host_paths (comma-separated)
#   HUSKER_EXEC_TIMEOUT_SECS                 →  exec_timeout_secs
#   HUSKER_EXEC_TIMEOUT_MAX_SECS             →  exec_timeout_max_secs
#   HUSKER_EXEC_ALLOWLIST                    →  exec_allowlist  (comma-separated)
#   HUSKER_EXEC_DENYLIST                     →  exec_denylist   (comma-separated)
#   HUSKER_EXEC_ENV_ALLOWLIST                →  exec_env_allowlist (comma-separated)
#   HUSKER_SERVICE_RECONCILE_INTERVAL        →  service_reconcile_interval_secs
#   HUSKER_SERVICE_RECONCILE_ENABLED         →  service_reconcile_enabled (1/true/TRUE/yes)
#   HUSKER_IDLE_POLL_INTERVAL_SECS           →  idle_policy.poll_interval_secs
#   HUSKER_IDLE_DEFAULT_TIMEOUT_SECS         →  idle_policy.default_idle_timeout_secs
#   HUSKER_IDLE_DEFAULT_SUSPEND_TTL_SECS     →  idle_policy.default_suspend_ttl_secs
#   HUSKER_IDLE_DEFAULT_AUTO_RESUME          →  idle_policy.default_auto_resume (1/true/yes/on)
#   HUSKER_FIRECRACKER_BIN                   →  firecracker_bin    (Linux only)
#   HUSKER_VMM                               →  vmm                (Linux only)
#   HUSKER_QEMU_BIN                          →  qemu_bin           (Linux only)
#   HUSKER_OVMF_CODE                         →  ovmf_code          (Linux only)
#   HUSKER_OVMF_VARS                         →  ovmf_vars          (Linux only)
#   HUSKER_HOST_INTERFACE                    →  host_interface     (Linux only)
#   HUSKER_BRIDGE_NAME                       →  bridge_name        (Linux only)
#   HUSKER_BRIDGE_SUBNET                     →  bridge_subnet      (Linux only)
#   HUSKER_DNS_SERVERS                       →  dns_servers        (Linux only, comma-separated)
#   HUSKER_CID_BASE                          →  cid_base           (Linux only)
#   HUSKER_LAN_BRIDGE                        →  lan_bridge         (Linux only)
#   HUSKER_RESOURCE_LIMITS                   →  resource_limits    (Linux only, 1/true/yes)
#   HUSKER_MEMORY_OVERHEAD_MIB               →  memory_overhead_mib (Linux only)
#   HUSKER_CPU_LIMIT                         →  cpu_limit          (Linux only, 1/true/yes)
#
# Example:
#   HUSKER_DATA_DIR=/tmp/husker husker daemon
