# Husker configuration file
#
# Config file discovery order:
#   1. --config flag (explicit path)
#   2. ~/.config/husker/config.toml (user config)
#   3. /etc/husker/config.toml (system config)
#
# All fields are optional and have sensible defaults.

# ── Storage ──────────────────────────────────────────────────────────

# Base directory for VM images, state database, and runtime files.
#   macOS default: ~/.local/share/husker
#   Linux default: /var/lib/husker when writable, otherwise ~/.local/share/husker
#                  (honors $XDG_DATA_HOME). Setting HUSKER_DATA_DIR also
#                  cascades to default_kernel/default_rootfs/default_initrd
#                  unless those are set explicitly.
# data_dir = "/var/lib/husker"

# ── Kernel ───────────────────────────────────────────────────────────

# Default kernel used when --kernel is not passed to `husker run`.
#   macOS default: <data_dir>/kernels/Image-virt   (uncompressed ARM64 Image)
#   Linux default: <data_dir>/kernels/vmlinux       (uncompressed x86_64 ELF)
# default_kernel = "/var/lib/husker/kernels/vmlinux"

# Path to the default rootfs image. Used when `husker run` is invoked
# without an explicit rootfs argument.
#   aarch64 default: <data_dir>/images/alpine-aarch64.ext4
#   x86_64 default:  <data_dir>/images/alpine-x86_64.ext4
# default_rootfs = "/var/lib/husker/images/alpine-x86_64.ext4"

# Optional initrd/initramfs path used alongside the default kernel.
# Apple VZ requires one for Alpine linux-virt (virtio_blk is a module,
# not built-in) - build with `make build-initramfs`.
# default_initrd = "/var/lib/husker/kernels/initramfs-virt.gz"

# Default disk size for cloud-image VMs when --disk-size is omitted (e.g. "10G").
# default_disk_size = "10G"

# OVMF firmware for UEFI/cloud-image boot (Linux only).
# ovmf_code = "/usr/share/OVMF/OVMF_CODE_4M.fd"
# ovmf_vars = "/usr/share/OVMF/OVMF_VARS_4M.fd"

# Base URL for `husker images pull`. Must host kernel-<arch>,
# initramfs-<arch>.gz, rootfs-<arch>.ext4, and SHA256SUMS at the root.
# images_base_url = "https://github.com/rvben/husker/releases/latest/download"

# ── API Security and Limits ─────────────────────────────────────────

# Optional bearer token required by mutating and shell endpoints.
# Set this in production or whenever daemon binds beyond localhost.
# api_token = "replace-with-a-long-random-token"

# Global max HTTP request body size accepted by the API (bytes).
# api_max_request_bytes = 2097152

# Max bytes returned by files/read endpoint before request is rejected.
# api_max_file_read_bytes = 1048576

# Max decoded bytes accepted by files/write endpoint.
# api_max_file_write_bytes = 1048576

# Sliding-window limit for sensitive API routes per client per minute.
# A value of 0 disables rate limiting.
# api_sensitive_rate_limit_per_minute = 120

# Allowed guest path prefixes for read and write operations.
# Empty lists allow all absolute guest paths.
# allowed_read_paths = ["/tmp", "/var/log"]
# allowed_write_paths = ["/tmp", "/var/tmp"]

# Exec policy controls.
# Empty allowlist permits all commands not explicitly denied.
# exec_timeout_secs = 30
# Upper bound for per-request exec timeouts (husker exec/job --timeout).
# exec_timeout_max_secs = 3600
# exec_allowlist = ["echo", "ls", "cat"]
# exec_denylist = ["rm", "mkfs", "dd"]
# exec_env_allowlist = ["PATH", "HOME", "TERM"]

# ── Firecracker / QEMU (Linux only) ─────────────────────────────────

# Path to the Firecracker binary. Must be on a filesystem that supports
# execution. On most distros the default of "firecracker" works if it's
# installed in $PATH.
# firecracker_bin = "firecracker"

# VMM backend: "firecracker" (default) or "qemu" (Linux only, full QEMU/KVM VMs).
# vmm = "firecracker"
# Path to the qemu-system binary when vmm = "qemu" (env: HUSKER_QEMU_BIN).
# qemu_bin = "qemu-system-x86_64"

# ── Networking (Linux only) ──────────────────────────────────────────

# Host interface used for outbound NAT from guest VMs.
# host_interface = "eth0"

# Bridge device created by the daemon for guest networking.
# bridge_name = "husker0"

# Subnet from which /30 blocks are allocated to each VM.
# The gateway (.1 of the subnet) is assigned to the bridge.
# bridge_subnet = "172.20.0.0/24"

# DNS servers injected into guest /etc/resolv.conf via the agent.
# dns_servers = ["8.8.8.8", "1.1.1.1"]

# Starting CID for vsock and TAP-name allocation. Two co-located daemons must
# use distinct bases so their CID/TAP spaces are disjoint (e.g. 3 + 1000).
# cid_base = 1000

# Host bridge to use for bridged-mode VMs (--net bridged). The bridge must be
# pre-created by the administrator; husker only enslaves the VM's TAP to it.
# Bridged mode also requires --cloud-image (DHCP via cloud-init). Unset means
# bridged mode is unavailable and any --net bridged request is rejected.
# lan_bridge = "br0"

# ── Service Reconciler ───────────────────────────────────────────────

# Background reconciler for service workloads.
# reconcile_interval_secs = 15   # how often the self-healing loop runs
# enabled = true                 # master switch for the periodic reconcile loop

# ── Environment Variable Overrides ─────────────────────────────────
#
# All configuration values can be overridden via environment variables.
# Environment variables take precedence over file-based config.
#
#   HUSKER_DATA_DIR                          →  data_dir
#   HUSKER_DEFAULT_KERNEL                    →  default_kernel
#   HUSKER_DEFAULT_ROOTFS                    →  default_rootfs
#   HUSKER_DEFAULT_INITRD                    →  default_initrd
#   HUSKER_DEFAULT_DISK_SIZE                 →  default_disk_size
#   HUSKER_IMAGES_BASE_URL                   →  images_base_url
#   HUSKER_EXEC_TIMEOUT_SECS                 →  exec_timeout_secs
#   HUSKER_EXEC_TIMEOUT_MAX_SECS             →  exec_timeout_max_secs
#   HUSKER_SERVICE_RECONCILE_INTERVAL        →  service_reconcile_interval_secs
#   HUSKER_SERVICE_RECONCILE_ENABLED         →  service_reconcile_enabled (1/true/TRUE/yes)
#   HUSKER_FIRECRACKER_BIN                   →  firecracker_bin    (Linux only)
#   HUSKER_VMM                               →  vmm                (Linux only)
#   HUSKER_QEMU_BIN                          →  qemu_bin           (Linux only)
#   HUSKER_OVMF_CODE                         →  ovmf_code          (Linux only)
#   HUSKER_OVMF_VARS                         →  ovmf_vars          (Linux only)
#   HUSKER_HOST_INTERFACE                    →  host_interface     (Linux only)
#   HUSKER_BRIDGE_NAME                       →  bridge_name        (Linux only)
#   HUSKER_BRIDGE_SUBNET                     →  bridge_subnet      (Linux only)
#   HUSKER_DNS_SERVERS                       →  dns_servers        (Linux only, comma-separated)
#   HUSKER_CID_BASE                          →  cid_base           (Linux only)
#   HUSKER_LAN_BRIDGE                        →  lan_bridge         (Linux only)
#
# Example:
#   HUSKER_DATA_DIR=/tmp/husker husker daemon
