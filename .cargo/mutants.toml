# cargo-mutants configuration for `make mutation-gate`.
#
# Exercise the shared wire, frozen-input and result contracts. Insertion-order
# maps make canonical key sorting observable even when a consumer enables that
# serde_json feature; ordinary package tests retain the default map mode.
features = ["serde_json/preserve_order"]
#
# Exclusions below cover proven equivalence or existing timeout-only mutants.
# All exclusions are anchored on the containing function name (not line numbers)
# so they survive edits elsewhere in the file. The chunked payload read lives in
# its own `read_exact_chunked` helper precisely so its loop-counter mutant can be
# excluded by name without also excluding the size guard in
# `read_message_with_timeout`, which IS tested.
exclude_re = [
    # base64 combines NON-overlapping bit fields, e.g. `(x & 0x03) << 4` sets
    # bits 4-5 while `y >> 4` sets bits 0-3, so bitwise-OR and XOR are identical
    # here. These `| -> ^` mutants are equivalent and cannot be killed. (The
    # `& -> ^` mutants on the same lines DO differ and are caught by round trip.)
    'replace \| with \^ in base64_encode',
    'replace \| with \^ in base64_decode',

    # The 16 MiB cap is a DoS guard; whether a message of *exactly* MAX bytes is
    # accepted or rejected is a don't-care (both are safe). The strictly-greater
    # path is covered by `encode_and_write_reject_payload_larger_than_max`.
    'replace > with >= in encode_message',
    'replace > with >= in write_message',

    # Loop-counter mutations that turn a bounded loop into a non-terminating one
    # are only observable as a wall-clock timeout, which is non-deterministic in
    # CI. Correct termination for valid inputs is covered by the round-trip and
    # chunked-read tests.
    'replace > with >= in read_exact_chunked', # `while remaining > 0`
    'replace \+= with \*= in base64_encode',   # `i += 3`
    'replace \+= with \*= in base64_decode',   # `i += 4`

    # These call sites combine disjoint constant Unix flags (O_RDONLY is zero),
    # so OR and XOR are identical. The generic `open` helper is deliberately
    # tested with flags already present: toggling either security bit must fail.
    'replace \| with \^ in (open_fresh_directory|walk|collect_declared_artifact|FrozenBundle::write_new_file|FrozenBundle::extract_new_directory)$',
    # Extraction opens a directory just created or reported as existing. Removing
    # the redundant O_DIRECTORY flag cannot make a successful extraction differ.
    'replace \| with & in FrozenBundle::extract_new_directory$',
    # Reading `size + 1` instead of `size` bytes only matters for a file that
    # grows during the read, which the length and metadata comparison after the
    # read already rejects; `size * 1` therefore reads the same accepted inputs.
    'replace \+ with \* in (walk|collect_declared_artifact)$',
    # Any `mkdir` failure other than EEXIST leaves the component missing, so the
    # `open` that follows fails with the same error; ignoring it is unobservable.
    'replace match guard error.kind\(\) == io::ErrorKind::AlreadyExists with true in FrozenBundle::extract_new_directory',
]
